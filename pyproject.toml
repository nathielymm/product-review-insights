[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-social-listening-analyst"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyarrow", "numpy", "scikit-learn", "faiss-cpu", "sentence-transformers", "psutil"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
social-listening = "social_listening.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
